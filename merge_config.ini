# Configuration pour les scripts de fusion de doublons
# Modifiez ces paramètres selon votre environnement

[PATHS]
# Chemin vers votre dataset Plantdataset
dataset_path = C:\path\to\your\Plantdataset

# Chemin de sauvegarde (laisser vide pour auto-génération)
backup_path =

# Dossier pour archiver les dossiers vides
empty_folders_dir = empty_folders

[ANALYSIS]
# Seuil minimum d'images pour considérer un dossier comme valide
min_images_threshold = 0

# Activer la journalisation détaillée
verbose_logging = true

[NORMALIZATION]
# Règles de normalisation des noms (ajoutez vos propres règles)
# Format: terme_original = terme_normalisé

# Maladies bactériennes
bacterial_spot = bacterial spot
bacterial_blight = bacterial blight

# Maladies fongiques
leaf_blight = leaf blight
late_blight = late blight
powdery_mildew = powdery mildew
downy_mildew = downy mildew
fusarium_head_blight = fusarium head blight
cercospora_leaf_spot = cercospora leaf spot

# Rouilles
brown_rust = brown rust
yellow_rust = yellow rust
common_rust = common rust

# Autres maladies
anthracnose = anthracnose
septoria = septoria
target_spot = target spot
black_rot = black rot
leaf_scorch = leaf scorch
verticillium_wilt = verticillium wilt

# Virus
curl_virus = curl virus
mosaic_virus = mosaic virus
yellow_leaf_curl_virus = yellow leaf curl virus

# Ravageurs
spider_mite = spider mite
aphid = aphid
whitefly = whitefly
thrips = thrips
flea_beetle = flea beetle
fall_armyworm = fall armyworm

# États
healthy = healthy

[MERGE]
# Stratégie de résolution des conflits de noms de fichiers
# rename: ajouter un suffixe numérique (recommandé)
# skip: ignorer les fichiers en conflit
# overwrite: écraser les fichiers existants (dangereux!)
conflict_resolution = rename

# Nombre maximum de tentatives pour résoudre un conflit
max_conflict_attempts = 100

[BACKUP]
# Créer toujours une sauvegarde avant fusion
always_backup = true

# Vérifier l'intégrité de la sauvegarde
verify_backup = true

[LOGGING]
# Niveau de logging: DEBUG, INFO, WARNING, ERROR
log_level = INFO

# Fichier de log (laisser vide pour console uniquement)
log_file =

[PERFORMANCE]
# Nombre maximum de fichiers à traiter en une fois
batch_size = 1000

# Timeout pour les opérations de fichier (secondes)
file_operation_timeout = 30